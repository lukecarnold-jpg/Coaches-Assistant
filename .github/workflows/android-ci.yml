name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The job only reads the repo; outputs go out as workflow artifacts, which need no token scope. Set
# here rather than relying on the repository's default, so a settings change can't widen it.
permissions:
  contents: read

# Actions are pinned to commit SHAs (with the version alongside) because a tag can be moved to
# different code, and the signing step below runs with the release keystore. Dependabot updates
# the SHA and the comment together.
jobs:
  build:
    # Pinned rather than ubuntu-latest (which moves to Ubuntu 26 on 2026-10-19), so the build
    # environment only changes when this line does.
    runs-on: ubuntu-24.04
    env:
      # Whether the release-signing secrets are configured, without exposing the secret itself to
      # every step (secrets can't be used in step `if:` conditions directly).
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: versionCode is the commit count (see app/build.gradle.kts), which a
          # shallow clone would get wrong.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Formatting and basic Kotlin style (ktlint); `./gradlew spotlessApply` fixes most of it.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      # Release builds are minified with R8, which debug builds never exercise; building one here
      # catches missing keep rules (and other release-only breakage) before a real release does.
      - name: Build release APK
        run: ./gradlew assembleRelease

      # R8's mapping for this build, which turns an obfuscated release stack trace back into real
      # class, method, and line names. Kept for every build since any commit might be released.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      # A signed bundle for Google Play, on pushes to master once the signing secrets are set
      # (repo Settings -> Secrets and variables -> Actions): RELEASE_KEYSTORE_BASE64 (the upload
      # keystore, base64-encoded), RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      # See README, "Publishing".
      - name: Build signed release bundle
        if: github.event_name == 'push' && env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease
          rm "$RUNNER_TEMP/release.jks"

      - name: Upload signed release bundle
        if: github.event_name == 'push' && env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
